  - name: ci-kubernetes-s390x-conformance-latest-kubetest2
    cron: "0 2-23/3 * * *" # every 3h starting at 02:00 UTC
    max_concurrency: 3
    cluster: k8s-infra-s390x-prow-build
    labels:
      preset-ibmcloud-cred-z: "true"
    decorate: true
    decoration_config:
      timeout: 220m
    extra_refs:
      - base_ref: test-user
        org: sudharshanibm
        repo: provider-ibmcloud-test-infra
        workdir: true
    annotations:
      description: Runs conformance tests using kubetest2 against kubernetes ci latest on IBM VPC
      testgrid-dashboards: ibm-s390x-k8s, conformance-s390x, ibm-k8s-e2e
      testgrid-tab-name: ci-kubernetes-s390x-conformance-latest-kubetest2
    spec:
      containers:
        - image: us-central1-docker.pkg.dev/k8s-staging-test-infra/images/kubekins-e2e:v20260504-c27e3ff179-master
          securityContext:
            privileged: true
          env:
            - name: "BOSKOS_HOST"
              value: "boskos.test-pods.svc.cluster.local"
            - name: "USER"
              value: "ci-kubernetes-s390x-conformance-latest-kubetest2"
          resources:
            requests:
              cpu: 1
              memory: "6Gi"
            limits:
              cpu: 4
              memory: "14Gi"
          command:
            - runner.sh
          args:
            - bash
            - -c
            - |
              set -o xtrace
              set +o errexit
              export PATH=$GOPATH/bin:$PATH
              export GO111MODULE=on
              RESOURCE_TYPE="vpc-service"
              BOSKOS_ACQUIRED=false
              BOSKOS_LOG="${ARTIFACTS}/boskos.log"

              #Call to boskos to checkout resource
              release_account(){
                if [[ "${BOSKOS_ACQUIRED}" != true ]]; then
                  return 0
                fi
                [[ -z "${HEART_BEAT_PID:-}" ]] || kill "${HEART_BEAT_PID}" || true
                HEART_BEAT_PID=""
                url="http://${BOSKOS_HOST}/release?type=${RESOURCE_TYPE}&name=${BOSKOS_RESOURCE_NAME}&dest=dirty&owner=${USER}"
                status_code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "${url}")
                if [[ ${status_code} != 200 ]]; then
                  echo "Failed to release resource: ${BOSKOS_RESOURCE_NAME}"
                  return 1
                fi
                BOSKOS_ACQUIRED=false
              }

              cleanup_boskos(){
                if [ -n "${BOSKOS_HOST:-}" ]; then
                  release_account >> "${BOSKOS_LOG}" 2>&1 || true
                fi
              }

              heartbeat_account(){
                count=0
                url="http://${BOSKOS_HOST}/update?type=${RESOURCE_TYPE}&name=${BOSKOS_RESOURCE_NAME}&state=busy&owner=${USER}"
                while [ ${count} -lt 120 ]
                do
                  status_code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "${url}")
                  if [[ ${status_code} != 200 ]]; then
                    echo "Heart beat to resource '${BOSKOS_RESOURCE_NAME}' failed due to invalid response, status code: ${status_code}"
                    exit 1
                  fi
                  count=$(( $count + 1 ))
                  sleep 60
                done
              }

              acquire_account(){
                max_attempts=180
                attempt=1
                url="http://${BOSKOS_HOST}/acquire?type=${RESOURCE_TYPE}&state=free&dest=busy&owner=${USER}"
                while [ ${attempt} -le ${max_attempts} ]; do
                  output=$(curl -sS -X POST "${url}")
                  curl_rc=$?
                  if [[ ${curl_rc} == 0 && ! ${output} =~ "failed" ]]; then
                    export BOSKOS_RESOURCE_NAME=$(echo "${output}" | jq -r '.name')
                    export BOSKOS_REGION=$(echo "${output}" | jq -r '.userdata["region"]')
                    export BOSKOS_RESOURCE_GROUP=$(echo "${output}" | jq -r '.userdata["resource-group-name"]')
                    export BOSKOS_ZONE=$(echo "${output}" | jq -r '.userdata["zone"]')
                    export BOSKOS_SUBNET_NAME=$(echo "${output}" | jq -r '.userdata["subnet-name"]')
                    export BOSKOS_SUBNET_ID=$(echo "${output}" | jq -r '.userdata["subnet-id"]')
                    BOSKOS_ACQUIRED=true
                    return 0
                  fi
                  echo "No free Boskos ${RESOURCE_TYPE} resource available yet; retrying in 60s (${attempt}/${max_attempts})"
                  attempt=$((attempt + 1))
                  sleep 60
                done
                echo "Failed to acquire resource from Boskos of type ${RESOURCE_TYPE}"
                return 1
              }

              if [ -n "${BOSKOS_HOST:-}" ]; then
                set +o xtrace
                acquire_account || exit 1
                trap cleanup_boskos EXIT
                heartbeat_account >> "${BOSKOS_LOG}" 2>&1 &
                HEART_BEAT_PID=$(echo $!)
              fi

              #Setup of kubetest2 tf deployer and ginkgo tester
              make install-deployer-tf
              go install sigs.k8s.io/kubetest2/kubetest2-tester-ginkgo@latest

              CLUSTER_NAME="config1-$(date +%s)"
              kubetest2 tf  --target-provider vpc  --vpc-node-image-name ibm-ubuntu-22-04-4-minimal-s390x-3 --boskos-resource-type ${RESOURCE_TYPE} \
              --vpc-region ${BOSKOS_REGION} --vpc-zone ${BOSKOS_ZONE} --vpc-subnet ${BOSKOS_SUBNET_NAME} \
              --vpc-name ${BOSKOS_RESOURCE_NAME} \
              --vpc-resource-group ${BOSKOS_RESOURCE_GROUP} \
              --vpc-ssh-key k8s-s390x-ssh-key \
              --vpc-node-profile bz2-4x16 \
              --ssh-private-key /etc/secret-volume/ssh-privatekey \
              --extra-vars=ansible_user:k8s-admin \
              --extra-vars=ansible_become:true \
              --extra-vars=ansible_become_method:sudo \
              --extra-vars=k8s_tar_bundles:kubernetes-server-linux-s390x.tar.gz \
              --extra-vars=pod_subnet:10.244.0.0/16 \
              --extra-vars=cni_provider:flannel \
              --build-version $(curl -Ls https://dl.k8s.io/ci/latest.txt) \
              --cluster-name $CLUSTER_NAME \
              --workers-count 2 \
              --up --auto-approve --retry-on-tf-failure 3 \
              --break-kubetest-on-upfail true \
              --build-version $(curl -Ls https://dl.k8s.io/ci/latest.txt) \
              --test=ginkgo -- --parallel 10 --test-package-dir ci --test-package-marker latest.txt --focus-regex='\[Conformance\]' --skip-regex='\[Serial\]'; rc1=$?
              export KUBECONFIG="$(pwd)/$CLUSTER_NAME/kubeconfig"
              export ARTIFACTS=$ARTIFACTS/serial_tests_artifacts
              #Run Serial Conformance tests
              kubetest2 tf --target-provider vpc --vpc-region ${BOSKOS_REGION} --vpc-zone ${BOSKOS_ZONE} \
                --ignore-cluster-dir true \
                --cluster-name $CLUSTER_NAME \
                --down --auto-approve --ignore-destroy-errors \
                --test=ginkgo -- --test-package-dir ci \
                --test-package-marker latest.txt --focus-regex='\[Serial\].*\[Conformance\]'; rc2=$?
              if [ -n "${BOSKOS_HOST:-}" ]; then
                if ! release_account >> "${BOSKOS_LOG}" 2>&1; then
                  exit 1
                fi
              fi

              if [ $rc1 != 0 ]; then
                  echo "ERROR: Non Serial k8s Conformance tests exited with code: $rc1"
                  exit $rc1
              elif [ $rc2 != 0 ]; then
                  echo "ERROR: Serial k8s Conformance tests exited with code: $rc2"
                  exit $rc2
              fi

  - annotations:
      fork-per-release-cron: 0 17 * * *
      testgrid-dashboards: ibm-s390x-k8s, conformance-s390x, ibm-k8s-e2e
      testgrid-num-failures-to-alert: "2"
      testgrid-tab-name: ci-kubernetes-s390x-conformance-latest-1.36
    cron: "0 13 * * *"
    max_concurrency: 3
    cluster: k8s-infra-s390x-prow-build
    decorate: true
    decoration_config:
      timeout: 5h0m0s
    extra_refs:
    - base_ref: test-user
      org: sudharshanibm
      repo: provider-ibmcloud-test-infra
      workdir: true
    labels:
      preset-ibmcloud-cred-z: "true"
    name: ci-kubernetes-s390x-conformance-latest-1-35-nam
    spec:
      containers:
      - args:
        - bash
        - -c
        - |
          set -o xtrace
          set +o errexit
          export PATH=$GOPATH/bin:$PATH
          export GO111MODULE=on
          RESOURCE_TYPE="vpc-service"
          BOSKOS_ACQUIRED=false
          BOSKOS_LOG="${ARTIFACTS}/boskos.log"

          #Call to boskos to checkout resource
          release_account(){
            if [[ "${BOSKOS_ACQUIRED}" != true ]]; then
              return 0
            fi
            [[ -z "${HEART_BEAT_PID:-}" ]] || kill "${HEART_BEAT_PID}" || true
            HEART_BEAT_PID=""
            url="http://${BOSKOS_HOST}/release?type=${RESOURCE_TYPE}&name=${BOSKOS_RESOURCE_NAME}&dest=dirty&owner=${USER}"
            status_code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "${url}")
            if [[ ${status_code} != 200 ]]; then
              echo "Failed to release resource: ${BOSKOS_RESOURCE_NAME}"
              return 1
            fi
            BOSKOS_ACQUIRED=false
          }

          cleanup_boskos(){
            if [ -n "${BOSKOS_HOST:-}" ]; then
              release_account >> "${BOSKOS_LOG}" 2>&1 || true
            fi
          }

          heartbeat_account(){
            count=0
            url="http://${BOSKOS_HOST}/update?type=${RESOURCE_TYPE}&name=${BOSKOS_RESOURCE_NAME}&state=busy&owner=${USER}"
            while [ ${count} -lt 120 ]
            do
              status_code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "${url}")
              if [[ ${status_code} != 200 ]]; then
                echo "Heart beat to resource '${BOSKOS_RESOURCE_NAME}' failed due to invalid response, status code: ${status_code}"
                exit 1
              fi
              count=$(( $count + 1 ))
              sleep 60
             done
          }

          acquire_account(){
            max_attempts=180
            attempt=1
            url="http://${BOSKOS_HOST}/acquire?type=${RESOURCE_TYPE}&state=free&dest=busy&owner=${USER}"
            while [ ${attempt} -le ${max_attempts} ]; do
              output=$(curl -sS -X POST "${url}")
              curl_rc=$?
              if [[ ${curl_rc} == 0 && ! ${output} =~ "failed" ]]; then
                export BOSKOS_RESOURCE_NAME=$(echo "${output}" | jq -r '.name')
                export BOSKOS_REGION=$(echo "${output}" | jq -r '.userdata["region"]')
                export BOSKOS_RESOURCE_GROUP=$(echo "${output}" | jq -r '.userdata["resource-group-name"]')
                export BOSKOS_ZONE=$(echo "${output}" | jq -r '.userdata["zone"]')
                export BOSKOS_SUBNET_NAME=$(echo "${output}" | jq -r '.userdata["subnet-name"]')
                export BOSKOS_SUBNET_ID=$(echo "${output}" | jq -r '.userdata["subnet-id"]')
                BOSKOS_ACQUIRED=true
                return 0
              fi
              echo "No free Boskos ${RESOURCE_TYPE} resource available yet; retrying in 60s (${attempt}/${max_attempts})"
              attempt=$((attempt + 1))
              sleep 60
            done
            echo "Failed to acquire resource from Boskos of type ${RESOURCE_TYPE}"
            return 1
          }

          if [ -n "${BOSKOS_HOST:-}" ]; then
            set +o xtrace
            acquire_account || exit 1
            trap cleanup_boskos EXIT
            set -o xtrace
            heartbeat_account >> "${BOSKOS_LOG}" 2>&1 &
            HEART_BEAT_PID=$(echo $!)
          else
            echo "ERROR: BOSKOS_HOST is not set. Cannot acquire resources."
            exit 1
          fi

          MARKER_VERSION=latest-1.35.txt;
          # Fetch build version only once
          K8S_BUILD_VERSION=$(curl -Ls https://dl.k8s.io/ci/$MARKER_VERSION);

          echo "Using Kubernetes version: ${K8S_BUILD_VERSION}"

          #Setup of kubetest2 tf deployer
          make install-deployer-tf
          go install sigs.k8s.io/kubetest2/kubetest2-tester-ginkgo@latest

          # Generate unique cluster name
          CLUSTER_NAME="conformance-$(date +%s)"

          # Run kubetest2 with proper variables
          kubetest2 tf --target-provider vpc --vpc-node-image-name ibm-ubuntu-22-04-4-minimal-s390x-3 \
                --boskos-resource-type ${RESOURCE_TYPE} --vpc-region ${BOSKOS_REGION} --vpc-zone ${BOSKOS_ZONE} \
                --vpc-subnet ${BOSKOS_SUBNET_NAME} --vpc-name ${BOSKOS_RESOURCE_NAME} \
                --vpc-resource-group ${BOSKOS_RESOURCE_GROUP} \
                --vpc-ssh-key k8s-s390x-ssh-key \
                --vpc-node-profile bz2-4x16 --ssh-private-key /etc/secret-volume/ssh-privatekey \
                --extra-vars=ansible_user:k8s-admin --extra-vars=ansible_become:true \
                --extra-vars=ansible_become_method:sudo \
                --extra-vars=k8s_tar_bundles:kubernetes-server-linux-s390x.tar.gz \
                --extra-vars=pod_subnet:10.244.0.0/16 --extra-vars=cni_provider:flannel \
                --workers-count 2 --cluster-name ${CLUSTER_NAME} --up --down --auto-approve \
                --retry-on-tf-failure 3 --break-kubetest-on-upfail true --ignore-destroy-errors \
                --build-version ${K8S_BUILD_VERSION} --release-marker ${K8S_BUILD_VERSION} \
                --test=ginkgo -- --test-package-dir ci --test-package-marker ${MARKER_VERSION} \
                --focus-regex='\[Conformance\]'; rc1=$?

          # Release Boskos resource
          if [ -n "${BOSKOS_HOST:-}" ]; then
            if ! release_account >> "${BOSKOS_LOG}" 2>&1; then
              exit 1
            fi
          fi

          if [ $rc1 != 0 ]; then
            echo "ERROR: k8s Conformance tests exited with code: $rc1"
            exit $rc1
          fi

          echo "All conformance tests passed successfully"
        command:
        - runner.sh
        image: us-central1-docker.pkg.dev/k8s-staging-test-infra/images/kubekins-e2e:v20260504-c27e3ff179-1.35
        name: ""
        env:
          - name: "BOSKOS_HOST"
            value: "boskos.test-pods.svc.cluster.local"
          - name: "USER"
            value: "ci-kubernetes-s390x-conformance-latest-1-35-nam"
        resources:
          limits:
              cpu: "4"
              memory: 14Gi
          requests:
            cpu: "1"
            memory: 6Gi
        securityContext:
          privileged: true
